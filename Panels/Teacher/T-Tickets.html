    <!-- Main Content -->
    <div class="col-md-10 offset-md-2 p-4">
        <div class="container">
            <h3 class="text-primary">تیکت های ارسالی </h3>

            <form id="ticket" class="mt-2 bg-white border-4 border-primary border-start rounded-3 p-4">
                <label for="title" class="form-label ">عنوان</label>
                <input
                        type="text"
                        class="form-control rounded-end-2 border-1"
                        id="title"
                        placeholder="عنوان مورد نظر خود را بنویسید."
                        required
                        minlength="3"
                >
                <label for="text" class="form-label">متن</label>
                <textarea
                        type="text"
                        class="form-control rounded-end-2 border-1"
                        id="text"
                        placeholder="متن مورد نظر خود را بنویسید."
                        required
                        minlength="3"
                ></textarea>
                <button type="submit" class="btn btn-primary w-100 mt-4 border-1" id="ticket-submitBtn">
                    ارسال
                </button>
            </form>
            <hr>
            <div class="row">
                <div class="col-12 bg-primary-subtle p-3 rounded-3">
                    <div class="container d-flex justify-content-between">

            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#sidebar"
    >
        <span class="navbar-toggler-icon"></span>
    </button>

<div class="container-fluid">
    <!-- Side-Bar -->
    <div class="row">
        <div
                class="offcanvas-xxl offcanvas-start bg-secondary text-white"
                tabindex="-1"
                id="sidebar"
        >
            <div class="offcanvas-header d-md-none">
                <h5 class="offcanvas-title">منو</h5>
                <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body p-3">
                <ul class="navbar-nav">
                    <h5 class="text-light p-3 text-center">پنل مدیریت</h5>
                    <li class="nav-item">
                        <a href="./T-Quests.html" class=" text-start btn my-1 btn-outline-light py-2 w-100 ">
                            بازگشت به صفحه قبلی
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./T-Courses.html" class=" text-start btn my-1 btn-outline-light py-2 w-100 ">
                            دوره ها
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="./T-Articles.html" class=" text-start btn my-1 btn-outline-light py-2 w-100 ">

                        </a>
                    </li>
                    <li class="nav-item">

                            فایل های قابل دانلود
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./T-Notifs.html" class=" text-start btn my-1 btn-outline-light py-2 borde w-100 ">
                            اعلانات
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./T-Quests.html"
                           class=" text-start btn my-1 btn-outline-light py-2 w-100 active">
                            امتحانات
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="T-NEAS.html"
                           class=" text-start btn my-1 btn-outline-light py-2 w-100">
                            اخبار/رویداد/اطلاعیه
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="./T-Tickets.html"
                           class=" text-start btn my-1 btn-outline-light py-2 borde w-100">
                            تیکت ها
                        </a>

                        <button class="btn my-1 btn-danger text-light w-100 ">
                            خروج
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="col-md-10 offset-md-2 p-4">
        <h3 class="text-primary">طراحی سوالات امتحانی</h3>

        <!-- اطلاعات آزمون -->
        <div class="bg-white p-3 mt-2 rounded">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="Q-name">عنوان آزمون</label>
                    <input type="text" class="form-control" min="0" placeholder="مثال: آزمون نهایی PHP" name="Q-name" id="Q-name">
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="C-name">نام دوره</label>
                    <input type="text" class="form-control" min="0" placeholder="مثال: برنامه‌نویسی PHP پیشرفته" name="C-name" id="C-name">
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="T-name">نام مدرس</label>
                    <input type="text" class="form-control" min="0" placeholder="مثال: استاد محمدی" name="T-name" id="T-name">
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="AleastQ-score">حداقل نمره قبولی (درصد)</label>
                    <input type="number" class="form-control" min="0" value="50" max="100" name="Q-score" id="AleastQ-score">
                </div>
            </div>
        </div>

        <!-- سوالات -->
        <div id="questionsContainer" class="bg-white p-3 mt-2 rounded">
            
            <div class="bg-white p-3 mt-2 rounded flex justify-content-center align-items-center">
                <p class="text-center">سوالی وجود ندارد.</p>
            </div>
            
            <div class="question-card" id="question-1">
                <div class="question-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold">سوال 1</h5>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-danger btn-icon" onclick="removeQuestion(1)" title="حذف"><i class="bi bi-x-lg"></i> حذف</button>
                    </div>
                </div>
                <div class="p-3">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">نوع سوال</label>
                            <select class="form-select question-type" onchange="changeQuestionType(this, 1)">
                                <option value="truefalse">صحیح/غلط</option>
                                <option value="multiple" selected>چند گزینه‌ای</option>
                                <option value="codeoutput">خروجی کد</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="Q-score">نمره سوال</label>
                            <input type="number" class="form-control" min="1" value="1" name="Q-score" id="Q-score">
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="form-label" for="Q-text">متن سوال</label>
                        <textarea class="form-control" rows="3" placeholder="متن سوال را وارد کنید..." id="Q-text" name="Q-text"></textarea>
                    </div>
                    <div class="code-block-section mt-3 d-none">
                        <label class="form-label" for="Q-code">بلوک کد</label>
                        <textarea class="form-control" rows="3" placeholder="کد خود را اینجا وارد کنید..." name="Q-code" id="Q-code"></textarea>
                    </div>
                    <div class="row g-3 mt-2 options-container" id="options-1">
                        <!-- Options will be rendered here -->
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-2">
            <button class="btn btn-success w-100" onclick="addQuestion()">
                <i class="bi bi-plus-lg"></i> افزودن سؤال جدید
            </button>
            <button type="submit" class="btn btn-primary w-100 mt-4" id="submitBtn">
                انتشار
            </button>
        </div>
    </div>
</div>

<!--Loader-->
<div class="loader-wrapper">
    <div class="loader" id="loader"></div>
</div>
<!-- Scripts -->
<script src="../../src/js/QuestCreate.js"></script>
<script src="../../src/js/bootstrap.bundle.min.js"></script>
<script src="../../src/js/admin.js"></script>
<script src="../../src/js/script.js"></script>
</body>
</html>
